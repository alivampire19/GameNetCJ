          package com.cj.gamenet.util

          import java.util.Calendar
          import java.util.Locale

          object Fa {
            private const val FA = "۰۱۲۳۴۵۶۷۸۹"

            fun digits(s: String) = buildString { for (c in s) append(if (c in '0'..'9') FA[c - '0'] else c) }
            fun num(v: Long) = digits(String.format(Locale.US, "%,d", v))
            fun num(v: Int) = num(v.toLong())
            fun toman(v: Long, unit: String = "تومان") = "${num(v)} $unit"
            fun timer(ms: Long): String {
              val t = ms / 1000
              return digits(String.format(Locale.US, "%02d:%02d:%02d", t / 3600, (t % 3600) / 60, t % 60))
            }
            fun duration(minutes: Long): String {
              val h = minutes / 60; val m = minutes % 60
              return when {
                h > 0 && m > 0 -> "${num(h)} ساعت و ${num(m)} دقیقه"
                h > 0 -> "${num(h)} ساعت"
                else -> "${num(m)} دقیقه"
              }
            }
            fun gregorianToJalali(gy: Int, gm: Int, gd: Int): IntArray {
              val gDm = intArrayOf(0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334)
              val gy2 = if (gm > 2) gy + 1 else gy
              var days = 355666 + 365 * gy + (gy2 + 3) / 4 - (gy2 + 99) / 100 + (gy2 + 399) / 400 + gd + gDm[gm - 1]
              var jy = -1595 + 33 * (days / 12053); days %= 12053
              jy += 4 * (days / 1461); days %= 1461
              if (days > 365) { jy += (days - 1) / 365; days = (days - 1) % 365 }
              val jm = if (days < 186) 1 + days / 31 else 7 + (days - 186) / 30
              val jd = 1 + (if (days < 186) days % 31 else (days - 186) % 30)
              return intArrayOf(jy, jm, jd)
            }
            fun date(ms: Long): String {
              val c = Calendar.getInstance().apply { timeInMillis = ms }
              val j = gregorianToJalali(c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1, c.get(Calendar.DAY_OF_MONTH))
              return digits(String.format(Locale.US, "%d/%02d/%02d", j[0], j[1], j[2]))
            }
            fun time(ms: Long): String {
              val c = Calendar.getInstance().apply { timeInMillis = ms }
              return digits(String.format(Locale.US, "%02d:%02d", c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE)))
            }
            private fun startOf(week: Boolean, field: Int, value: Int): Long =
              Calendar.getInstance().apply {
                set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0)
                set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                firstDayOfWeek = Calendar.SATURDAY
                if (week) set(field, value)
              }.timeInMillis
            fun startOfToday() = startOf(false, 0, 0)
            fun startOfWeek() = startOf(true, Calendar.DAY_OF_WEEK, Calendar.SATURDAY)
            fun startOfMonth() = startOf(true, Calendar.DAY_OF_MONTH, 1)
          }
