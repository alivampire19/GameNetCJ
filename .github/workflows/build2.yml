            val devices = dao.devices().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
            val services = dao.services().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
            val activeSessions = dao.activeWithLogs().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
            val paidSessions = dao.paidSessions().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
            val products = dao.products().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
            val customers = dao.customers().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
            val reservations = dao.reservations().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
            val discounts = dao.discounts().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
            val settings = dao.settingsFlow().map { l -> l.associate { it.key to it.value } }
