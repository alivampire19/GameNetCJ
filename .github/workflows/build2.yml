                    if (o.isNull("startDate")) null else o.getLong("startDate"),
                    if (o.isNull("endDate")) null else o.getLong("endDate"), o.getBoolean("isActive"))) }
                  root.getJSONArray("settings").each { o -> d.putSetting(SettingEntry(o.getString("key"), o.getString("value"))) }
                }
              }
              true
            } catch (e: Exception) { false }

            fun readText(ctx: Context, uri: Uri): String =
              ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""

            fun writeText(ctx: Context, uri: Uri, text: String) {
              ctx.contentResolver.openOutputStream(uri)?.use { it.write(text.toByteArray(Charsets.UTF_8)) }
            }
