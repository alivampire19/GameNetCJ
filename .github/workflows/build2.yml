          cat > app/src/main/java/com/cj/gamenet/data/Model.kt << 'KTEOF'
          package com.cj.gamenet.data

          import androidx.room.*

          @Entity(tableName = "devices")
          data class Device(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val name: String, val type: String, val number: Int,
            val controllerCount: Int = 4, val isActive: Boolean = true,
            val status: String = "FREE"
          )

          @Entity(tableName = "services")
          data class Service(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val deviceId: Long?, val name: String,
            val controllerCount: Int = 1, val hourlyPrice: Long,
            val isActive: Boolean = true
          )

          @Entity(tableName = "sessions")
          data class Session(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val deviceId: Long, val deviceName: String,
            val customerId: Long? = null, val customerName: String? = null,
            val startTime: Long, val endTime: Long? = null,
            val initialCredit: Long = 0, val gameCost: Long = 0,
            val buffetCost: Long = 0, val totalDurationMinutes: Long = 0,
            val finalAmount: Long = 0, val isPaid: Boolean = false
          )

          @Entity(tableName = "session_service_logs")
          data class SessionServiceLog(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val sessionId: Long, val serviceId: Long?, val serviceName: String,
            val controllerCount: Int, val hourlyPrice: Long,
            val startTime: Long, val endTime: Long? = null
          )

          data class SessionWithLogs(
            @Embedded val session: Session,
            @Relation(parentColumn = "id", entityColumn = "sessionId")
            val logs: List<SessionServiceLog>
          )

          @Entity(tableName = "products")
          data class Product(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val name: String, val price: Long, val category: String = "عمومی",
            val stock: Int = -1, val imageUri: String? = null, val isActive: Boolean = true
          )

          @Entity(tableName = "buffet_orders")
          data class BuffetOrder(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val sessionId: Long?, val customerId: Long? = null,
            val totalAmount: Long, val timestamp: Long, val isPaid: Boolean = false
          )

          @Entity(tableName = "buffet_order_items")
          data class BuffetOrderItem(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val orderId: Long, val productId: Long?, val productName: String,
            val unitPrice: Long, val quantity: Int
          )

          @Entity(tableName = "customers")
          data class Customer(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val firstName: String, val lastName: String = "",
            val phone: String? = null, val notes: String? = null,
            val joinDate: Long = System.currentTimeMillis(),
            val totalMinutes: Long = 0, val visitCount: Int = 0,
            val totalPaid: Long = 0, val rewardProgressMinutes: Long = 0,
            val availableRewards: Int = 0
          )

          @Entity(tableName = "reservations")
          data class Reservation(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val deviceId: Long, val customerName: String,
            val startTime: Long, val durationMinutes: Int, val note: String? = null
          )

          @Entity(tableName = "discounts")
          data class Discount(
            @PrimaryKey(autoGenerate = true) val id: Long = 0,
            val title: String, val percent: Int = 0, val fixedAmount: Long = 0,
            val startDate: Long? = null, val endDate: Long? = null,
            val isActive: Boolean = true
          )

          @Entity(tableName = "settings")
          data class SettingEntry(@PrimaryKey val key: String, val value: String)

          data class NameCount(val name: String, val c: Int, val s: Long)
          KTEOF

          cat > app/src/main/java/com/cj/gamenet/data/Keys.kt << 'KTEOF'
