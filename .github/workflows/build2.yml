          @Composable
          fun DevicesScreen(vm: AppViewModel, go: (String) -> Unit) {
            val devices by vm.devices.collectAsState()
            val active by vm.activeSessions.collectAsState()
            val reservations by vm.reservations.collectAsState()
            var search by remember { mutableStateOf("") }
            var now by remember { mutableLongStateOf(System.currentTimeMillis()) }
            var addDevice by remember { mutableStateOf(false) }
            var editDevice by remember { mutableStateOf<Device?>(null) }
            var startFor by remember { mutableStateOf<Device?>(null) }

            LaunchedEffect(Unit) { while (true) { delay(15000); now = System.currentTimeMillis() } }

            Column(Modifier.fillMaxSize().padding(16.dp)) {
              RowCenter {
                Text("دستگاه‌ها", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold, color = Gold, modifier = Modifier.weight(1f))
                IconButton({ go("reservations") }) { Icon(Icons.Filled.Event, null, tint = PurpleLight) }
                IconButton({ addDevice = true }) { Icon(Icons.Filled.Add, null, tint = Gold) }
              }
              Spacer(Modifier.height(8.dp))
              OutlinedTextField(search, { search = it }, label = { Text("🔍 جستجوی دستگاه") }, modifier = Modifier.fillMaxWidth(), singleLine = true)
              Spacer(Modifier.height(8.dp))
              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                items(devices.filter { it.name.contains(search, true) || it.type.contains(search, true) }) { d ->
                  val swl = active.find { it.session.deviceId == d.id }
                  val reserved = reservations.any { it.deviceId == d.id && it.startTime <= now && it.startTime + it.durationMinutes * 60000L >= now }
                  val status = when { !d.isActive -> "DISABLED"; swl != null -> "PLAYING"; reserved -> "RESERVED"; else -> "FREE" }
                  DeviceCard(d, swl, status,
                    onStart = { startFor = d },
                    onManage = { swl?.let { go("session/${it.session.id}") } },
                    onEdit = { editDevice = d })
                }
              }
            }
            if (addDevice) DeviceEditorDialog(vm, null) { addDevice = false }
            editDevice?.let { DeviceEditorDialog(vm, it) { editDevice = null } }
            startFor?.let { d -> StartSessionDialog(vm, d, onDismiss = { startFor = null }, onStarted = { id -> startFor = null; go("session/$id") }) }
          }

          @Composable
          fun DeviceCard(d: Device, swl: SessionWithLogs?, status: String, onStart: () -> Unit, onManage: () -> Unit, onEdit: () -> Unit) {
            var now by remember { mutableLongStateOf(System.currentTimeMillis()) }
            LaunchedEffect(Unit) { while (true) { delay(1000); now = System.currentTimeMillis() } }
            val (dot, label) = when (status) {
              "PLAYING" -> Red to "🔴 در حال بازی"
              "RESERVED" -> Yellow to "🟡 رزرو شده"
              "DISABLED" -> TextDim to "⚫ غیرفعال"
              else -> Green to "🟢 آزاد"
            }
            Card(colors = CardDefaults.cardColors(containerColor = CardBg)) {
              Column(Modifier.padding(14.dp)) {
                RowCenter {
                  Text("🎮 ${d.name}", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                  Text(label, color = dot, style = MaterialTheme.typography.bodySmall)
                }
                if (status == "PLAYING" && swl != null) {
                  val cost = PricingEngine.gameCost(swl.logs, now)
                  val elapsed = PricingEngine.elapsedMs(swl.logs, now)
                  val remain = PricingEngine.remaining(swl.session.initialCredit, cost)
                  Spacer(Modifier.height(6.dp))
                  Text("مشتری: ${swl.session.customerName ?: "بدون مشتری"}", color = TextDim)
                  Text("⏱ زمان: ${Fa.timer(elapsed)}", color = TextMain, fontWeight = FontWeight.Bold)
                  RowCenter {
                    Text("💰 هزینه: ${Fa.toman(cost)}", color = Gold, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                    if (swl.session.initialCredit > 0)
                      Text("باقی‌مانده: ${Fa.toman(remain)}", color = if (remain <= 0) Red else Green, style = MaterialTheme.typography.bodySmall)
                  }
                }
                Spacer(Modifier.height(10.dp))
                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  when (status) {
                    "FREE", "RESERVED" -> {
                      Button(onStart, Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = Purple)) {
                        Icon(Icons.Filled.PlayArrow, null); Text("شروع بازی")
                      }
                    }
                    "PLAYING" -> {
                      OutlinedButton(onManage, Modifier.weight(1f)) { Text("مدیریت") }
                      Button(onManage, Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = Red)) { Text("پایان بازی") }
                    }
                    else -> {
                      OutlinedButton({}, Modifier.weight(1f), enabled = false) { Text("غیرفعال") }
                    }
                  }
                  IconButton(onEdit) { Icon(Icons.Filled.Edit, null, tint = PurpleLight) }
                }
              }
            }
          }

          @Composable
          fun DeviceEditorDialog(vm: AppViewModel, initial: Device?, onDismiss: () -> Unit) {
            var name by remember { mutableStateOf(initial?.name ?: "") }
            var type by remember { mutableStateOf(initial?.type ?: "") }
            var number by remember { mutableStateOf((initial?.number ?: 1).toString()) }
            var controllers by remember { mutableStateOf((initial?.controllerCount ?: 4).toString()) }
            var isActive by remember { mutableStateOf(initial?.isActive ?: true) }
            var confirmDelete by remember { mutableStateOf(false) }
            AlertDialog(onDismissRequest = onDismiss,
              title = { Text(if (initial == null) "افزودن دستگاه" else "ویرایش دستگاه") },
              text = {
                Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  LabeledText("نام دستگاه (مثلاً PS5 شماره ۱)", name) { name = it }
                  LabeledText("نوع (PS5 / PS4 / PC / Xbox ...)", type) { type = it }
                  LabeledNum("شماره دستگاه", number) { number = it }
                  LabeledNum("تعداد دسته", controllers) { controllers = it }
                  RowCenter { Text("فعال", Modifier.weight(1f)); Switch(isActive, { isActive = it }) }
                  Text("💡 قیمت هر تعداد دسته را از تنظیمات ← مدیریت سرویس‌ها تعیین کنید.", style = MaterialTheme.typography.bodySmall, color = TextDim)
                }
              },
              confirmButton = {
                TextButton({
                  if (name.isNotBlank()) vm.saveDevice(Device(initial?.id ?: 0, name.trim(),
                    type.trim().ifBlank { "دستگاه" }, number.toIntOrNull() ?: 1, controllers.toIntOrNull() ?: 4, isActive))
                  onDismiss()
                }) { Text("ذخیره", color = Gold) }
              },
              dismissButton = {
                Row {
                  if (initial != null) TextButton({ confirmDelete = true }) { Text("حذف", color = Red) }
                  TextButton(onDismiss) { Text("انصراف") }
                }
              })
            if (confirmDelete) ConfirmDialog("حذف دستگاه", "«${initial?.name}» حذف شود؟",
              onYes = { vm.deleteDevice(initial!!); confirmDelete = false; onDismiss() },
              onDismiss = { confirmDelete = false })
          }

          @Composable
          fun StartSessionDialog(vm: AppViewModel, device: Device, onDismiss: () -> Unit, onStarted: (Long) -> Unit) {
            var services by remember { mutableStateOf<List<Service>>(emptyList()) }
            var selected by remember { mutableStateOf<Service?>(null) }
            var credit by remember { mutableStateOf("") }
            val customers by vm.customers.collectAsState()
            var customerId by remember { mutableStateOf<Long?>(null) }
            var showNewCustomer by remember { mutableStateOf(false) }

            LaunchedEffect(device.id) {
              services = vm.servicesFor(device.id)
              if (selected == null) selected = services.firstOrNull()
            }
            AlertDialog(onDismissRequest = onDismiss, title = { Text("🎮 ${device.name} — شروع بازی") },
              text = {
                Column {
                  if (services.isEmpty()) {
                    Text("⚠️ برای این دستگاه سرویس/قیمتی تعریف نشده.\nاز تنظیمات ← مدیریت سرویس‌ها اضافه کنید.", color = Red)
                  } else {
                    Text("سرویس / تعداد دسته:", color = TextDim)
                    services.forEach { s ->
                      Row(Modifier.fillMaxWidth().padding(vertical = 2.dp), verticalAlignment = Alignment.CenterVertically) {
                        RadioButton(selected?.id == s.id, { selected = s })
                        Column(Modifier.weight(1f)) {
                          Text("${s.name} (${Fa.num(s.controllerCount)} دسته)")
                          Text("${Fa.toman(s.hourlyPrice)} / ساعت", style = MaterialTheme.typography.bodySmall, color = Gold)
                        }
                      }
                    }
                  }
                  Spacer(Modifier.height(8.dp))
                  LabeledNum("مبلغ اولیه (تومان) — اختیاری", credit, hint = "0")
                  Spacer(Modifier.height(8.dp))
                  Text("مشتری (اختیاری):", color = TextDim)
                  Column(Modifier.heightIn(max = 130.dp).verticalScroll(rememberScrollState())) {
                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      RadioButton(customerId == null, { customerId = null }); Text("بدون مشتری")
                    }
                    customers.forEach { c ->
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        RadioButton(customerId == c.id, { customerId = c.id }); Text("${c.firstName} ${c.lastName}")
                      }
                    }
                    TextButton({ showNewCustomer = true }) { Text("➕ مشتری جدید...") }
                  }
                }
              },
              confirmButton = {
                TextButton(enabled = selected != null, onClick = {
                  val s = selected ?: return@TextButton
                  vm.startSession(device, s, credit.toLongOrNull() ?: 0,
                    customerId?.let { cid -> customers.find { it.id == cid } }) { onStarted(it) }
                }) { Text("▶ شروع", color = Gold) }
              },
              dismissButton = { TextButton(onDismiss) { Text("انصراف") } })

            if (showNewCustomer) QuickCustomerDialog(vm) { c ->
              showNewCustomer = false
              if (c != null) customerId = c.id
            }
          }

          @Composable
          fun QuickCustomerDialog(vm: AppViewModel, onResult: (Customer?) -> Unit) {
            var f by remember { mutableStateOf("") }
            var l by remember { mutableStateOf("") }
            val scope = rememberCoroutineScope()
            AlertDialog(onDismissRequest = { onResult(null) }, title = { Text("مشتری جدید") },
              text = { Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                LabeledText("نام *", f) { f = it }; LabeledText("نام خانوادگی", l) { l = it } } },
              confirmButton = {
                TextButton(onClick = {
                  if (f.isNotBlank()) scope.launch {
                    val id = vm.addCustomer(Customer(firstName = f.trim(), lastName = l.trim()))
                    onResult(vm.customerOf(id))
                  } else onResult(null)
                }) { Text("ذخیره", color = Gold) }
              },
              dismissButton = { TextButton({ onResult(null) }) { Text("انصراف") } })
          }
