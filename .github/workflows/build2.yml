                    if (o.isNull("customerId")) null else o.getLong("customerId"),
                    o.getLong("totalAmount"), o.getLong("timestamp"), o.getBoolean("isPaid"))) }
                  root.getJSONArray("orderItems").each { o -> d.insertOrderItem(BuffetOrderItem(o.getLong("id"),
                    o.getLong("orderId"), if (o.isNull("productId")) null else o.getLong("productId"),
                    o.getString("productName"), o.getLong("unitPrice"), o.getInt("quantity"))) }
                  root.getJSONArray("customers").each { o -> d.insertCustomer(Customer(o.getLong("id"),
                    o.getString("firstName"), o.getString("lastName"),
                    if (o.isNull("phone")) null else o.getString("phone"),
                    if (o.isNull("notes")) null else o.getString("notes"), o.getLong("joinDate"),
                    o.getLong("totalMinutes"), o.getInt("visitCount"), o.getLong("totalPaid"),
                    o.getLong("rewardProgressMinutes"), o.getInt("availableRewards"))) }
                  root.getJSONArray("reservations").each { o -> d.insertReservation(Reservation(o.getLong("id"),
                    o.getLong("deviceId"), o.getString("customerName"), o.getLong("startTime"),
                    o.getInt("durationMinutes"), if (o.isNull("note")) null else o.getString("note"))) }
                  root.getJSONArray("discounts").each { o -> d.insertDiscount(Discount(o.getLong("id"),
