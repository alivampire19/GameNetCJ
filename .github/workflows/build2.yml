            fun saveDevice(d: Device) = go { repo.saveDevice(d) }
            fun deleteDevice(d: Device) = go { repo.deleteDevice(d) }
            fun saveService(s: Service) = go { repo.saveService(s) }
            fun deleteService(s: Service) = go { repo.deleteService(s) }
            fun saveProduct(p: Product) = go { repo.saveProduct(p) }
            fun deleteProduct(p: Product) = go { repo.deleteProduct(p) }
            fun saveCustomer(c: Customer) = go { repo.saveCustomer(c) }
            fun deleteCustomer(c: Customer) = go { repo.deleteCustomer(c) }
            fun consumeReward(id: Long) = go { repo.consumeReward(id) }
            fun saveDiscount(d: Discount) = go { repo.saveDiscount(d) }
            fun deleteDiscount(d: Discount) = go { repo.deleteDiscount(d) }
            fun addReservation(r: Reservation) = go { repo.addReservation(r) }
            fun deleteReservation(r: Reservation) = go { repo.deleteReservation(r) }
            fun setSetting(k: String, v: String) = go { repo.setSetting(k, v) }
            fun startSession(device: Device, service: Service, credit: Long, customer: Customer?, onDone: (Long) -> Unit) =
