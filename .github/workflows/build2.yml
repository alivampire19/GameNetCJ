          @Composable
          fun DashboardScreen(vm: AppViewModel, go: (String) -> Unit) {
            val devices by vm.devices.collectAsState()
            val active by vm.activeSessions.collectAsState()
            val reservations by vm.reservations.collectAsState()
            val customers by vm.customers.collectAsState()
            var now by remember { mutableLongStateOf(System.currentTimeMillis()) }
            var todaySales by remember { mutableLongStateOf(0L) }
            var buffetCount by remember { mutableIntStateOf(0) }

            LaunchedEffect(Unit) { while (true) { delay(30000); now = System.currentTimeMillis() } }
            LaunchedEffect(active.size) { val r = vm.todaySales(); todaySales = r.first; buffetCount = r.second }

            val reservedNow = reservations.count { it.startTime <= now && it.startTime + it.durationMinutes * 60000L >= now }
            val free = devices.count { it.isActive && active.none { s -> s.session.deviceId == it.id } }

            Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp)) {
              RowCenter {
                Column(Modifier.weight(1f)) {
                  Text(vm.s(Keys.NET_NAME, "گیم نت سی جی"), style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold, color = Gold)
                  Text("پنل مدیریت حرفه‌ای", style = MaterialTheme.typography.bodySmall, color = TextDim)
                }
                IconButton({ go("settings") }) { Icon(Icons.Filled.Settings, null, tint = PurpleLight) }
              }
              Spacer(Modifier.height(12.dp))
              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                StatCard("در حال بازی", Fa.num(active.size), modifier = Modifier.weight(1f))
                StatCard("آزاد", Fa.num(free), modifier = Modifier.weight(1f))
              }
              Spacer(Modifier.height(8.dp))
              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                StatCard("رزرو شده", Fa.num(reservedNow), modifier = Modifier.weight(1f))
                StatCard("غیرفعال", Fa.num((devices.size - active.size - free - reservedNow).coerceAtLeast(0)), modifier = Modifier.weight(1f))
              }
              Spacer(Modifier.height(8.dp))
              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                StatCard("فروش امروز", Fa.toman(todaySales), gold = true, modifier = Modifier.weight(1f))
                StatCard("سفارش بوفه امروز", Fa.num(buffetCount), modifier = Modifier.weight(1f))
              }
              Spacer(Modifier.height(8.dp))
              StatCard("مشتریان ثبت‌شده", Fa.num(customers.size), modifier = Modifier.fillMaxWidth())
              Spacer(Modifier.height(16.dp))
              SectionTitle("میانبرهای سریع")
              val labels = listOf("شروع بازی", "بوفه", "باشگاه مشتریان", "گزارش فروش", "رزرو دستگاه", "افزودن دستگاه")
              val routes = listOf("devices", "buffet", "customers", "reports", "reservations", "devices")
              LazyVerticalGrid(columns = GridCells.Fixed(3), modifier = Modifier.height(240.dp),
                horizontalArrangement = Arrangement.spacedBy(8.dp), verticalArrangement = Arrangement.spacedBy(8.dp),
                userScrollEnabled = false) {
                items(labels.size) { i ->
                  Card(onClick = { go(routes[i]) }, colors = CardDefaults.cardColors(containerColor = CardBg)) {
                    Box(Modifier.fillMaxSize().padding(8.dp), contentAlignment = Alignment.Center) {
                      Text(labels[i], color = PurpleLight, fontWeight = FontWeight.Bold)
                    }
                  }
                }
              }
            }
          }
