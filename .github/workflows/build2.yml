name: Build APK v2

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate project files
        run: |
          set -e
          mkdir -p app/src/main/res/values app/src/main/java/com/cj/gamenet/data app/src/main/java/com/cj/gamenet/logic app/src/main/java/com/cj/gamenet/util app/src/main/java/com/cj/gamenet/ui/screens

          cat > settings.gradle.kts << 'KTEOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "GameNetCJ"
          include(":app")
          KTEOF

          cat > build.gradle.kts << 'KTEOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "2.0.21" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
            id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          KTEOF

          cat > gradle.properties << 'KTEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          KTEOF

          cat > app/build.gradle.kts << 'KTEOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
            id("com.google.devtools.ksp")
          }
          android {
            namespace = "com.cj.gamenet"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.cj.gamenet"
              minSdk = 24
              targetSdk = 34
              versionCode = 1
              versionName = "1.0.0"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
            buildFeatures { compose = true }
          }
          dependencies {
            implementation(platform("androidx.compose:compose-bom:2024.09.03"))
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
            implementation("androidx.navigation:navigation-compose:2.8.2")
            implementation("androidx.room:room-runtime:2.6.1")
            implementation("androidx.room:room-ktx:2.6.1")
            ksp("androidx.room:room-compiler:2.6.1")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
            implementation("io.coil-kt:coil-compose:2.7.0")
          }
          KTEOF

          cat > app/src/main/AndroidManifest.xml << 'KTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:name=".GameNetApp"
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KTEOF

          cat > app/src/main/res/values/strings.xml << 'KTEOF'
          <resources>
              <string name="app_name">گیم نت سی جی</string>
          </resources>
          KTEOF

          cat > app/src/main/java/com/cj/gamenet/GameNetApp.kt << 'KTEOF'
