          @file:OptIn(ExperimentalMaterial3Api::class)
          package com.cj.gamenet.ui.screens

          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import com.cj.gamenet.data.*
          import com.cj.gamenet.logic.PricingEngine
          import com.cj.gamenet.ui.*
          import com.cj.gamenet.util.Fa
          import kotlinx.coroutines.delay

          @Composable
          fun ActiveSessionScreen(vm: AppViewModel, sessionId: Long, onFinished: () -> Unit) {
            val swlState by vm.observeSession(sessionId).collectAsState(initial = null)
            var now by remember { mutableLongStateOf(System.currentTimeMillis()) }
            var changeService by remember { mutableStateOf(false) }
            var orderBuffet by remember { mutableStateOf(false) }
            var endSession by remember { mutableStateOf(false) }

            LaunchedEffect(Unit) { while (true) { delay(1000); now = System.currentTimeMillis() } }

            val s = swlState?.firstOrNull() ?: return
            val logs = s.logs
            val cost = PricingEngine.gameCost(logs, now)
            val elapsed = PricingEngine.elapsedMs(logs, now)
            val remain = PricingEngine.remaining(s.session.initialCredit, cost)
            val current = logs.lastOrNull { it.endTime == null }
            val creditOver = s.session.initialCredit > 0 && remain <= 0

            Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp)) {
              Text("🎮 ${s.session.deviceName}", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold, color = Gold)
              Text("مشتری: ${s.session.customerName ?: "بدون مشتری"}", color = TextDim)
              Spacer(Modifier.height(16.dp))
              if (creditOver) Card(colors = CardDefaults.cardColors(containerColor = Red)) {
                Text("⚠️ هشدار: اعتبار مشتری به پایان رسیده است!", Modifier.padding(12.dp), color = Color.White, fontWeight = FontWeight.Bold)
              }
              Spacer(Modifier.height(12.dp))
              StatCard("⏱ زمان بازی", Fa.timer(elapsed), modifier = Modifier.fillMaxWidth())
              Spacer(Modifier.height(8.dp))
              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                StatCard("سرویس فعلی", current?.serviceName ?: "-", modifier = Modifier.weight(1f))
                StatCard("هزینه فعلی", Fa.toman(cost), gold = true, modifier = Modifier.weight(1f))
              }
              if (s.session.initialCredit > 0) {
                Spacer(Modifier.height(8.dp))
                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  StatCard("اعتبار اولیه", Fa.toman(s.session.initialCredit), modifier = Modifier.weight(1f))
                  StatCard("باقی‌مانده", Fa.toman(remain.coerceAtLeast(0)), gold = !creditOver, modifier = Modifier.weight(1f))
                }
              }
              Spacer(Modifier.height(16.dp))
              Button({ changeService = true }, Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Purple)) { Text("🔄 تغییر سرویس / دسته") }
              Spacer(Modifier.height(8.dp))
              Button({ orderBuffet = true }, Modifier.fillMaxWidth()) { Text("🥤 سفارش بوفه") }
              Spacer(Modifier.height(8.dp))
              Button({ endSession = true }, Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Gold)) {
                Text("⏹ پایان بازی و تسویه", color = Color.Black, fontWeight = FontWeight.Bold)
              }
              Spacer(Modifier.height(16.dp))
              SectionTitle("سوابق سرویس این جلسه")
              logs.forEach { l ->
                RowCenter(Modifier.padding(vertical = 4.dp)) {
                  Text("${Fa.time(l.startTime)} — ${l.endTime?.let { Fa.time(it) } ?: "اکنون"}", color = TextDim, modifier = Modifier.weight(1f))
                  Text("${l.serviceName} • ${Fa.toman(PricingEngine.costOfLog(l, now))}", color = TextMain)
                }
              }
            }

            if (changeService) ChangeServiceDialog(vm, s) { changeService = false }
            if (orderBuffet) BuffetOrderDialog(vm, s) { orderBuffet = false }
            if (endSession) EndSessionDialog(vm, s, cost, elapsed,
              onDismiss = { endSession = false },
              onDone = { endSession = false; onFinished() })
          }

          @Composable
          fun ChangeServiceDialog(vm: AppViewModel, swl: SessionWithLogs, onDismiss: () -> Unit) {
            var services by remember { mutableStateOf<List<Service>>(emptyList()) }
            var selected by remember { mutableStateOf<Service?>(null) }
            LaunchedEffect(swl.session.deviceId) {
              services = vm.servicesFor(swl.session.deviceId)
              selected = services.firstOrNull()
            }
            AlertDialog(onDismissRequest = onDismiss, title = { Text("تغییر سرویس (بدون توقف بازی)") },
              text = {
                Column {
                  services.forEach { svc ->
                    Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                      RadioButton(selected?.id == svc.id, { selected = svc })
                      Text("${svc.name} — ${Fa.toman(svc.hourlyPrice)}/ساعت")
                    }
                  }
                }
              },
              confirmButton = { TextButton({ selected?.let { vm.changeService(swl.session.id, it) }; onDismiss() }) { Text("ثبت تغییر", color = Gold) } },
              dismissButton = { TextButton(onDismiss) { Text("انصراف") } })
          }

          @Composable
          fun BuffetOrderDialog(vm: AppViewModel, swl: SessionWithLogs, onDismiss: () -> Unit) {
            val products by vm.products.collectAsState()
            val cart = remember { mutableStateMapOf<Long, Int>() }
            AlertDialog(onDismissRequest = onDismiss,
              title = { Text("🥤 سفارش بوفه — ${swl.session.deviceName}") },
              text = {
                Column {
                  val active = products.filter { it.isActive }
                  if (active.isEmpty()) Text("محصولی ثبت نشده. از تب بوفه اضافه کنید.", color = TextDim)
                  Column(Modifier.heightIn(max = 360.dp).verticalScroll(rememberScrollState())) {
                    active.forEach { p ->
                      val q = cart[p.id] ?: 0
                      RowCenter(Modifier.padding(vertical = 4.dp)) {
                        Column(Modifier.weight(1f)) {
                          Text(p.name)
                          Text("${Fa.toman(p.price)}" + if (p.stock >= 0) " • موجودی: ${Fa.num(p.stock)}" else "",
                            style = MaterialTheme.typography.bodySmall, color = TextDim)
                        }
                        IconButton({ if (q > 0) cart[p.id] = q - 1 }, enabled = q > 0) { Text("➖") }
                        Text(Fa.num(q), fontWeight = FontWeight.Bold)
                        IconButton({ cart[p.id] = q + 1 }) { Text("➕") }
                      }
                    }
                  }
                  val sum = cart.entries.sumOf { (pid, q) -> (products.find { it.id == pid }?.price ?: 0L) * q }
                  Spacer(Modifier.height(8.dp))
                  Text("جمع سفارش: ${Fa.toman(sum)}", color = Gold, fontWeight = FontWeight.Bold)
                }
              },
              confirmButton = { TextButton({
                if (cart.isNotEmpty()) vm.buffetOrder(swl.session.id, swl.session.customerId, cart.toMap())
                onDismiss()
              }) { Text("ثبت سفارش", color = Gold) } },
              dismissButton = { TextButton(onDismiss) { Text("انصراف") } })
          }

          @Composable
          fun EndSessionDialog(vm: AppViewModel, swl: SessionWithLogs, liveCost: Long, elapsedMs: Long,
                               onDismiss: () -> Unit, onDone: () -> Unit) {
            var buffet by remember { mutableLongStateOf(0L) }
            val discounts by vm.discounts.collectAsState()
            var discount by remember { mutableStateOf<Discount?>(null) }
            LaunchedEffect(Unit) { buffet = vm.buffetCostOf(swl.session.id) }
            val activeDiscounts = discounts.filter { it.isActive }
            val sub = liveCost + buffet
            val dAmount = discount?.let { it.fixedAmount + sub * it.percent / 100 } ?: 0
            val fin = (sub - dAmount).coerceAtLeast(0)

            AlertDialog(onDismissRequest = onDismiss,
              title = { Text("پایان بازی و تسویه", color = Gold) },
              text = {
                Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                  Text("مدت بازی: ${Fa.timer(elapsedMs)}", fontWeight = FontWeight.Bold)
                  Text("هزینه بازی: ${Fa.toman(liveCost)}")
                  Text("بوفه: ${Fa.toman(buffet)}")
                  if (activeDiscounts.isNotEmpty()) {
                    Text("تخفیف:", color = TextDim)
                    activeDiscounts.forEach { dd ->
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        RadioButton(discount?.id == dd.id, { discount = if (discount?.id == dd.id) null else dd })
                        Text("${dd.title} (" + (if (dd.percent > 0) "${Fa.num(dd.percent)}٪" else "") +
                          (if (dd.fixedAmount > 0) " ${Fa.toman(dd.fixedAmount)}" else "") + ")")
                      }
                    }
                  }
                  if (dAmount > 0) Text("تخفیف: ${Fa.toman(dAmount)}", color = Green)
                  Text("مبلغ نهایی: ${Fa.toman(fin)}", color = Gold, fontWeight = FontWeight.Bold,
                    style = MaterialTheme.typography.titleLarge)
                  Text("وضعیت: ✅ تسویه شد", color = Green)
                }
              },
              confirmButton = { TextButton({ vm.endSession(swl.session.id, discount) { onDone() } }) { Text("✅ تسویه و پایان", color = Gold) } },
              dismissButton = { TextButton(onDismiss) { Text("انصراف") } })
          }
