                IconButton(onBack) { Icon(Icons.Filled.ArrowBack, null) }
                Text("📅 رزرو دستگاه", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold, color = Gold, modifier = Modifier.weight(1f))
                IconButton({ add = true }) { Icon(Icons.Filled.Add, null, tint = Gold) }
              }
              LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                items(list) { r ->
                  val device = devices.find { it.id == r.deviceId }
                  Card(colors = CardDefaults.cardColors(containerColor = CardBg)) {
                    RowCenter(Modifier.padding(12.dp)) {
                      Column(Modifier.weight(1f)) {
                        Text("🟡 ${device?.name ?: "?"} — ${r.customerName}", fontWeight = FontWeight.Bold)
                        Text("${Fa.date(r.startTime)} ساعت ${Fa.time(r.startTime)} • مدت ${Fa.duration(r.durationMinutes.toLong())}",
                          style = MaterialTheme.typography.bodySmall, color = TextDim)
                      }
                      IconButton({ vm.deleteReservation(r) }) { Icon(Icons.Filled.Delete, null, tint = Red) }
                    }
                  }
                }
              }
            }
            if (add) AddReservationDialog(vm, devices.map { it.id to it.name }) { add = false }
          }

          @Composable
          fun AddReservationDialog(vm: AppViewModel, devices: List<Pair<Long, String>>, onDismiss: () -> Unit) {
            var deviceId by remember { mutableStateOf(devices.firstOrNull()?.first ?: 0L) }
            var name by remember { mutableStateOf("") }
            var duration by remember { mutableStateOf("60") }
            var dateState by remember { mutableStateOf<Long?>(null) }
            var hour by remember { mutableIntStateOf(18) }
            var minute by remember { mutableIntStateOf(0) }
            var showDate by remember { mutableStateOf(false) }
            var showTime by remember { mutableStateOf(false) }

            if (showDate) {
              val st = rememberDatePickerState()
              DatePickerDialog(onDismissRequest = { showDate = false },
                confirmButton = { TextButton({ dateState = st.selectedDateMillis; showDate = false }) { Text("تایید", color = Gold) } }
              ) { DatePicker(state = st) }
            }
            if (showTime) {
              val st = rememberTimePickerState(initialHour = hour, initialMinute = minute, is24Hour = true)
              AlertDialog(onDismissRequest = { showTime = false },
                confirmButton = { TextButton({ hour = st.hour; minute = st.minute; showTime = false }) { Text("تایید", color = Gold) } },
                dismissButton = { TextButton({ showTime = false }) { Text("انصراف") } }
              ) { TimePicker(state = st) }
            }

            AlertDialog(onDismissRequest = onDismiss, title = { Text("رزرو جدید") },
              text = {
                Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  if (devices.isEmpty()) Text("ابتدا دستگاه اضافه کنید.", color = Red)
                  Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                    devices.forEach { (id, nm) -> FilterChip(deviceId == id, { deviceId = id }) { Text(nm) } }
                  }
                  LabeledText("نام مشتری", name) { name = it }
                  TextButton({ showDate = true }) { Text("📆 تاریخ: ${dateState?.let { Fa.date(it) } ?: "انتخاب کنید"}", color = PurpleLight) }
                  TextButton({ showTime = true }) { Text("⏰ ساعت: ${Fa.digits("%02d:%02d".format(hour, minute))}", color = PurpleLight) }
                  LabeledNum("مدت (دقیقه)", duration) { duration = it }
                }
              },
              confirmButton = {
                TextButton({
                  val base = Calendar.getInstance().apply {
                    timeInMillis = dateState ?: System.currentTimeMillis()
                    set(Calendar.HOUR_OF_DAY, hour); set(Calendar.MINUTE, minute)
                    set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                  }
                  if (name.isNotBlank() && devices.isNotEmpty()) vm.addReservation(com.cj.gamenet.data.Reservation(
                    deviceId = deviceId, customerName = name.trim(),
                    startTime = base.timeInMillis, durationMinutes = duration.toIntOrNull() ?: 60))
                  onDismiss()
                }) { Text("ذخیره", color = Gold) }
              },
              dismissButton = { TextButton(onDismiss) { Text("انصراف") } })
          }
          KTEOF

          cat > app/src/main/java/com/cj/gamenet/ui/screens/SettingsScreen.kt << 'KTEOF'
          @file:OptIn(ExperimentalMaterial3Api::class)
          package com.cj.gamenet.ui.screens

          import android.net.Uri
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import com.cj.gamenet.data.*
          import com.cj.gamenet.ui.*
          import com.cj.gamenet.util.Fa

          @Composable
          fun SettingsScreen(vm: AppViewModel) {
            var unlocked by remember { mutableStateOf(!vm.pinEnabled()) }
            if (!unlocked) { PinGateDialog(vm) { unlocked = true }; return }
            Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp)) {
              Text("⚙️ تنظیمات مدیریت", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold, color = Gold)
              Spacer(Modifier.height(12.dp))
              NetInfoSection(vm); RewardSection(vm); PinSection(vm)
              ServicesSection(vm); DiscountsSection(vm); BackupSection(vm)
              Spacer(Modifier.height(24.dp))
              Text("Game Net CJ — نسخه ۱.۰", color = TextDim, style = MaterialTheme.typography.bodySmall)
            }
          }

          @Composable
          private fun PinGateDialog(vm: AppViewModel, onOk: () -> Unit) {
            var pin by remember { mutableStateOf("") }
            var error by remember { mutableStateOf(false) }
            AlertDialog(onDismissRequest = {}, title = { Text("🔒 قفل مدیریتی") },
              text = { Column {
                LabeledNum("رمز مدیریتی را وارد کنید", pin) { pin = it; error = false }
                if (error) Text("رمز اشتباه است", color = Red) } },
              confirmButton = { TextButton({ vm.checkPin(pin) { ok -> if (ok) onOk() else error = true } }) { Text("ورود", color = Gold) } })
          }

          @Composable
          private fun NetInfoSection(vm: AppViewModel) {
            val settings by vm.settings.collectAsState()
            var name by remember(settings) { mutableStateOf(vm.s(Keys.NET_NAME, "")) }
            var en by remember(settings) { mutableStateOf(vm.s(Keys.NET_NAME_EN, "")) }
            var phone by remember(settings) { mutableStateOf(vm.s(Keys.PHONE, "")) }
            var addr by remember(settings) { mutableStateOf(vm.s(Keys.ADDRESS, "")) }
            Card(colors = CardDefaults.cardColors(containerColor = CardBg)) {
              Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                SectionTitle("🏢 اطلاعات گیم‌نت")
                LabeledText("نام گیم‌نت", name) { name = it }
                LabeledText("نام انگلیسی", en) { en = it }
                LabeledText("شماره تماس", phone) { phone = it }
                LabeledText("آدرس", addr) { addr = it }
                Button({ listOf(Keys.NET_NAME to name, Keys.NET_NAME_EN to en, Keys.PHONE to phone, Keys.ADDRESS to addr)
                  .forEach { (k, v) -> vm.setSetting(k, v) } }) { Text("ذخیره اطلاعات") }
              }
            }
          }

          @Composable
          private fun RewardSection(vm: AppViewModel) {
            val settings by vm.settings.collectAsState()
            var enabled by remember(settings) { mutableStateOf(vm.s(Keys.REWARD_ENABLED, "true").toBoolean()) }
            var hours by remember(settings) { mutableStateOf(vm.s(Keys.REWARD_HOURS, "4")) }
            var title by remember(settings) { mutableStateOf(vm.s(Keys.REWARD_TITLE, "")) }
            var low by remember(settings) { mutableStateOf(vm.s(Keys.LOW_STOCK, "5")) }
            Card(colors = CardDefaults.cardColors(containerColor = CardBg)) {
              Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                SectionTitle("🏆 سیستم جایزه")
                RowCenter { Text("فعال", Modifier.weight(1f)); Switch(enabled, { enabled = it }) }
                LabeledNum("ساعت موردنیاز برای جایزه", hours) { hours = it }
                LabeledText("عنوان جایزه", title) { title = it }
                LabeledNum("آستانه هشدار موجودی بوفه", low) { low = it }
                Button({ vm.setSetting(Keys.REWARD_ENABLED, enabled.toString())
                  vm.setSetting(Keys.REWARD_HOURS, hours)
                  vm.setSetting(Keys.REWARD_TITLE, title)
                  vm.setSetting(Keys.LOW_STOCK, low) }) { Text("ذخیره تنظیمات جایزه") }
              }
            }
          }

          @Composable
          private fun PinSection(vm: AppViewModel) {
            var p1 by remember { mutableStateOf("") }
            Card(colors = CardDefaults.cardColors(containerColor = CardBg)) {
              Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                SectionTitle("🔒 قفل مدیریتی (PIN)")
                if (vm.pinEnabled()) {
                  Text("قفل فعال است.", color = Green)
                  Button({ vm.removePin() }) { Text("حذف رمز") }
                } else {
                  LabeledNum("رمز جدید (حداقل ۴ رقم)", p1) { p1 = it }
                  Button({ if (p1.length >= 4) vm.setPin(p1) }) { Text("فعال‌سازی قفل") }
                }
              }
            }
          }

          @Composable
          private fun ServicesSection(vm: AppViewModel) {
            val services by vm.services.collectAsState()
            val devices by vm.devices.collectAsState()
            var editor by remember { mutableStateOf<Service?>(null) }
            var isNew by remember { mutableStateOf(false) }
            Card(colors = CardDefaults.cardColors(containerColor = CardBg)) {
              Column(Modifier.padding(14.dp)) {
                SectionTitle("💵 مدیریت سرویس‌ها و قیمت‌ها")
                devices.forEach { d ->
                  val list = services.filter { it.deviceId == d.id }
                  if (list.isNotEmpty()) Text(d.name, color = PurpleLight, fontWeight = FontWeight.Bold)
                  list.forEach { s ->
                    RowCenter(Modifier.padding(vertical = 4.dp)) {
                      Text("${s.name} — ${Fa.toman(s.hourlyPrice)}/ساعت" + if (!s.isActive) " (غیرفعال)" else "", modifier = Modifier.weight(1f))
                      IconButton({ editor = s }) { Icon(Icons.Filled.Edit, null, tint = PurpleLight) }
                      IconButton({ vm.deleteService(s) }) { Icon(Icons.Filled.Delete, null, tint = Red) }
                    }
                  }
                }
                services.filter { it.deviceId == null }.forEach { s ->
                  RowCenter { Text("★ ${s.name} — ${Fa.toman(s.hourlyPrice)}/ساعت", modifier = Modifier.weight(1f))
                    IconButton({ editor = s }) { Icon(Icons.Filled.Edit, null, tint = PurpleLight) }
                    IconButton({ vm.deleteService(s) }) { Icon(Icons.Filled.Delete, null, tint = Red) }
                  }
                }
                Button({ isNew = true; editor = null }) { Text("➕ سرویس / قیمت جدید") }
              }
            }
            if (isNew || editor != null) ServiceEditorDialog(vm, devices, editor) { editor = null; isNew = false }
          }

          @Composable
          fun ServiceEditorDialog(vm: AppViewModel, devices: List<Device>, initial: Service?, onDismiss: () -> Unit) {
            var deviceId by remember { mutableStateOf(initial?.deviceId ?: devices.firstOrNull()?.id) }
            var name by remember { mutableStateOf(initial?.name ?: "") }
            var cc by remember { mutableStateOf((initial?.controllerCount ?: 1).toString()) }
            var price by remember { mutableStateOf(if (initial == null) "" else initial.hourlyPrice.toString()) }
            var active by remember { mutableStateOf(initial?.isActive ?: true) }
            AlertDialog(onDismissRequest = onDismiss,
              title = { Text(if (initial == null) "سرویس جدید" else "ویرایش سرویس") },
              text = {
                Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                    devices.forEach { d -> FilterChip(deviceId == d.id, { deviceId = d.id }) { Text(d.name) } }
                  }
                  FilterChip(deviceId == null, { deviceId = null }) { Text("ویژه / عمومی") }
                  LabeledText("نام سرویس (مثلاً: ۲ دسته)", name) { name = it }
                  LabeledNum("تعداد دسته", cc) { cc = it }
                  LabeledNum("قیمت هر ساعت (تومان)", price) { price = it }
                  RowCenter { Text("فعال", Modifier.weight(1f)); Switch(active, { active = it }) }
                }
              },
              confirmButton = {
                TextButton({
                  if (name.isNotBlank()) vm.saveService(Service(initial?.id ?: 0, deviceId, name.trim(),
                    cc.toIntOrNull() ?: 1, price.toLongOrNull() ?: 0, active))
                  onDismiss()
                }) { Text("ذخیره", color = Gold) }
              },
              dismissButton = { TextButton(onDismiss) { Text("انصراف") } })
          }

          @Composable
          private fun DiscountsSection(vm: AppViewModel) {
            val discounts by vm.discounts.collectAsState()
            var add by remember { mutableStateOf(false) }
            Card(colors = CardDefaults.cardColors(containerColor = CardBg)) {
              Column(Modifier.padding(14.dp)) {
                SectionTitle("🏷 تخفیف‌ها")
                discounts.forEach { d ->
                  RowCenter {
                    Text("${d.title} (" + (if (d.percent > 0) "${Fa.num(d.percent)}٪ " else "") +
                      (if (d.fixedAmount > 0) Fa.toman(d.fixedAmount) else "") + ")" +
                      if (d.isActive) "" else " (غیرفعال)", modifier = Modifier.weight(1f))
                    IconButton({ vm.deleteDiscount(d) }) { Icon(Icons.Filled.Delete, null, tint = Red) }
                  }
                }
                Button({ add = true }) { Text("➕ تخفیف جدید") }
              }
            }
            if (add) DiscountEditorDialog(vm) { add = false }
          }

          @Composable
          fun DiscountEditorDialog(vm: AppViewModel, onDismiss: () -> Unit) {
            var title by remember { mutableStateOf("") }
            var percent by remember { mutableStateOf("0") }
            var fixed by remember { mutableStateOf("0") }
            AlertDialog(onDismissRequest = onDismiss, title = { Text("تخفیف جدید") },
              text = { Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                LabeledText("عنوان", title) { title = it }
                LabeledNum("درصد تخفیف", percent) { percent = it }
                LabeledNum("مبلغ ثابت تخفیف", fixed) { fixed = it } } },
              confirmButton = {
                TextButton({
                  if (title.isNotBlank()) vm.saveDiscount(Discount(title = title.trim(),
                    percent = percent.toIntOrNull() ?: 0, fixedAmount = fixed.toLongOrNull() ?: 0))
                  onDismiss()
                }) { Text("ذخیره", color = Gold) }
              },
              dismissButton = { TextButton(onDismiss) { Text("انصراف") } })
          }

          @Composable
          private fun BackupSection(vm: AppViewModel) {
            val ctx = LocalContext.current
            var msg by remember { mutableStateOf("") }
            var pendingRestore by remember { mutableStateOf<Uri?>(null) }
            val backupLauncher = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/json")) { uri ->
              uri?.let { vm.backup(ctx, it) { m -> msg = m } } }
            val restoreLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
              pendingRestore = uri }
            Card(colors = CardDefaults.cardColors(containerColor = CardBg)) {
              Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                SectionTitle("💾 پشتیبان‌گیری و بازیابی")
                Button({ backupLauncher.launch("gamenet-cj-backup.json") }, Modifier.fillMaxWidth()) { Text("⬆️ تهیه نسخه پشتیبان (Backup)") }
                Button({ restoreLauncher.launch(arrayOf("application/json", "text/plain")) }, Modifier.fillMaxWidth(),
                  colors = ButtonDefaults.buttonColors(containerColor = Purple)) { Text("⬇️ بازیابی (Restore)") }
                if (msg.isNotBlank()) Text(msg, color = Gold)
              }
            }
            pendingRestore?.let { uri ->
              ConfirmDialog("بازیابی اطلاعات", "تمام اطلاعات فعلی با فایل پشتیبان جایگزین می‌شود. مطمئنید؟",
                yes = "بله، بازیابی کن",
                onYes = { vm.restore(ctx, uri) { m -> msg = m }; pendingRestore = null },
                onDismiss = { pendingRestore = null })
            }
          }
          KTEOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNetCJ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
