            suspend fun customerOf(id: Long) = repo.customer(id)
            suspend fun sessionsOf(id: Long) = repo.sessionsOf(id)
            suspend fun report(f: Long, t: Long) = repo.report(f, t)
            suspend fun todaySales() = repo.todaySales()
            suspend fun addCustomer(c: Customer): Long = repo.saveCustomer(c)
